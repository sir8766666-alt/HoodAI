<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoodAI Settings</title>
  <style>
    body {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      padding: 24px;
      max-width: 720px;
      margin: 0 auto;
      background: #0f0f10;
      color: #fff;
    }
    .card {
      background: #171717;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 700;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #ff7a18;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
    .hint {
      opacity: .7;
      font-size: 13px;
      line-height: 1.5;
    }
    .ok {
      margin-top: 12px;
      color: #7CFC98;
      font-weight: 700;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HoodAI</h1>
    <p class="hint">
      Paste your API token here. The extension will only show an ad while the AI is waiting.
    </p>

    <label for="apiToken">API Token</label>
    <input id="apiToken" type="text" placeholder="hood_xxx..." />

    <div class="row">
      <input id="enabled" type="checkbox" />
      <label for="enabled" style="margin:0;">Enabled</label>
    </div>

    <button id="saveBtn">Save</button>
    <div id="status" class="ok"></div>
  </div>

  <script>
    const apiTokenEl = document.getElementById("apiToken");
    const enabledEl = document.getElementById("enabled");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");

    function load() {
      chrome.storage.local.get(["apiToken", "enabled"], (data) => {
        apiTokenEl.value = data.apiToken || "";
        enabledEl.checked = data.enabled !== false;
      });
    }

    saveBtn.addEventListener("click", () => {
      chrome.storage.local.set(
        {
          apiToken: apiTokenEl.value.trim(),
          enabled: enabledEl.checked
        },
        () => {
          statusEl.textContent = "Saved.";
          setTimeout(() => (statusEl.textContent = ""), 1200);
        }
      );
    });

    load();
  </script>
</body>
</html>
